<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Enterprise Gateway</title>
    <link rel="icon" href="data:,">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1e38 50%, #090d16 100%);
            --panel-bg: rgba(30, 41, 59, 0.45);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-blue: #38bdf8;
            --glow-purple: #c084fc;
            --btn-gradient: linear-gradient(90deg, #2563eb, #7c3aed);
            --btn-hover: linear-gradient(90deg, #1d4ed8, #6d28d9);
            --success: #34d399;
            --error: #f87171;
            --info: #60a5fa;
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 60px 20px; 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1.7fr 1.3fr; 
            gap: 40px; 
            width: 100%;
        }

        @media (max-width: 900px) { 
            .container { grid-template-columns: 1fr; gap: 30px; }
            body { padding: 30px 16px; }
        }
        
        .header { 
            grid-column: 1 / -1; 
            background: var(--panel-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 40px; 
            border-radius: 24px; 
            border: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .header h2 { 
            margin: 0; 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { margin: 6px 0 0 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }
        
        .badge {
            color: #fff; 
            font-weight: 700; 
            font-size: 11px; 
            background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(124,58,237,0.2));
            padding: 8px 16px; 
            border-radius: 99px;
            border: 1px solid rgba(255,255,255,0.15);
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(56,189,248,0.15);
        }

        .products { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 24px; 
            align-content: start;
        }

        .product-card { 
            background: var(--panel-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px; 
            border-radius: 24px; 
            text-align: center; 
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(124,58,237,0.15), transparent 60%);
            pointer-events: none;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(56,189,248,0.1);
        }

        .product-card h3 { margin: 0 0 12px 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
        .price { 
            background: linear-gradient(90deg, var(--glow-blue), var(--glow-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800; 
            font-size: 1.85rem; 
            margin-bottom: 30px; 
            letter-spacing: -1px; 
        }
        
        .btn { 
            background: var(--btn-gradient); 
            color: #fff; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 700; 
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
            letter-spacing: -0.2px;
        }

        .btn:hover { 
            background: var(--btn-hover); 
            box-shadow: 0 6px 20px rgba(124,58,237,0.4);
            transform: scale(1.02);
        }
        .btn:disabled { 
            background: #334155 !important; 
            color: #64748b !important; 
            cursor: not-allowed; 
            box-shadow: none !important;
            transform: none !important;
        }
        
        .btn-remove { 
            background: rgba(248,113,113,0.1); 
            color: var(--error);
            border: 1px solid rgba(248,113,113,0.2);
            padding: 6px 14px; 
            font-size: 12px; 
            margin-top: 12px; 
            width: auto;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-remove:hover { background: rgba(248,113,113,0.2); border-color: var(--error); }
        
        .cart-section { 
            background: var(--panel-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            height: fit-content; 
        }

        .cart-section h3 { margin-top: 0; margin-bottom: 24px; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.06); 
        }
        .cart-item:last-of-type { border-bottom: none; }
        
        .cart-total { 
            font-size: 1.4rem; 
            font-weight: 800; 
            margin: 30px 0; 
            display: flex; 
            justify-content: space-between; 
            border-top: 1px dashed rgba(255,255,255,0.15); 
            padding-top: 24px;
            letter-spacing: -0.5px;
        }
        
        .env-toggle { margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px;}
        .env-toggle label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}
        .env-toggle select { 
            padding: 14px; 
            border-radius: 14px; 
            border: 1px solid var(--panel-border); 
            font-weight: 600;
            font-size: 15px;
            background: #1e293b;
            color: #fff;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }
        .env-toggle select:focus { border-color: var(--glow-blue); box-shadow: 0 0 15px rgba(56,189,248,0.15); }
        
        .subscription-box { 
            margin-bottom: 30px; 
            padding: 16px; 
            background: rgba(192,132,252,0.06); 
            border: 1px solid rgba(192,132,252,0.15); 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            gap: 14px; 
        }
        .subscription-box input { 
            width: 20px; 
            height: 20px; 
            cursor: pointer; 
            accent-color: var(--glow-purple);
        }
        .subscription-box label { font-size: 14px; font-weight: 600; color: #d8b4fe; cursor: pointer; user-select: none;}
        
        #payment-container { 
            display: none; 
            margin-top: 30px; 
            background: rgba(15,23,42,0.6); 
            padding: 24px; 
            border-radius: 16px; 
            border: 1px solid var(--panel-border);
        }
        #payment-form { min-height: 50px; margin-bottom: 24px; }
        
        /* Targets injected CyberSource iFrame components seamlessly */
        #payment-form iframe { background: transparent !important; color-scheme: dark; }

        .message { 
            margin-top: 24px; 
            font-weight: 600; 
            font-size: 14px; 
            text-align: center; 
            padding: 16px; 
            border-radius: 14px;
            backdrop-filter: blur(8px);
        }
        .success { background: rgba(52,211,153,0.1); color: var(--success); border: 1px solid rgba(52,211,153,0.25); box-shadow: 0 0 20px rgba(52,211,153,0.1); }
        .error { background: rgba(248,113,113,0.1); color: var(--error); border: 1px solid rgba(248,113,113,0.25); box-shadow: 0 0 20px rgba(248,113,113,0.1); }
        .info { background: rgba(96,165,250,0.1); color: var(--info); border: 1px solid rgba(96,165,250,0.25); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h2>TechStore Gateway Engine</h2>
                <p>Enterprise Environment Node Management</p>
            </div>
            <span class="badge">Bank Al Etihad Proxy</span>
        </div>

        <div class="products" id="product-list">
            <div class="product-card">
                <h3>Basic API Key</h3>
                <div class="price">0.10 JOD</div>
                <button type="button" class="btn add-to-cart-btn" data-id="1" data-name="Basic API Key" data-price="0.10">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Pro Dashboard</h3>
                <div class="price">0.15 JOD</div>
                <button type="button" class="btn add-to-cart-btn" data-id="2" data-name="Pro Dashboard" data-price="0.15">Add to Cart</button>
            </div>
        </div>

        <div class="cart-section">
            <h3>Secure Allocation</h3>
            <div id="cart-items">
                <p style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 30px 0; font-weight: 500;">No items queued in allocation module.</p>
            </div>
            
            <div class="cart-total">
                <span>Aggregated Total:</span>
                <span id="cart-total-price">0.00 JOD</span>
            </div>

            <div class="env-toggle">
                <label for="env-selector">Target Network Layer</label>
                <select id="env-selector">
                    <option value="prod">BAE / CyberSource (LIVE PROD)</option>
                    <option value="dev">BAE / CyberSource (BAELAB DEV)</option>
                </select>
            </div>

            <div class="subscription-box">
                <input type="checkbox" id="save-card-cb">
                <label for="save-card-cb">Authorize token recurring intervals</label>
            </div>

            <button type="button" id="checkout-btn" class="btn" disabled>Initialize Gateway Handshake</button>
            <div id="message" class="message" style="display: none;"></div>

            <div id="payment-container">
                <p style="font-size: 11px; font-weight: 700; margin-top: 0; margin-bottom: 20px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Secure Hosted Vault Fields</p>
                <div id="payment-form"></div>
                <button type="button" id="pay-btn" class="btn" style="background: var(--btn-gradient);">Execute Settlement</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let isCheckingOut = false;

        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotalPrice = document.getElementById('cart-total-price');
        const checkoutBtn = document.getElementById('checkout-btn');
        const paymentContainer = document.getElementById('payment-container');
        const messageDiv = document.getElementById('message');
        const payBtn = document.getElementById('pay-btn');
        const envSelector = document.getElementById('env-selector');
        const saveCardCheckbox = document.getElementById('save-card-cb');

        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isCheckingOut) return;
                const id = btn.getAttribute('data-id');
                const name = btn.getAttribute('data-name');
                const price = parseFloat(btn.getAttribute('data-price'));
                cart.push({ id, name, price });
                renderCart();
            });
        });

        window.removeFromCart = function(index) {
            if (isCheckingOut) return;
            cart.splice(index, 1);
            renderCart();
        };

        function getCartTotal() {
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            return total.toFixed(2);
        }

        function renderCart() {
            cartItemsDiv.innerHTML = '';
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 30px 0; font-weight: 500;">No items queued in allocation module.</p>';
                checkoutBtn.disabled = true;
            } else {
                cart.forEach((item, index) => {
                    cartItemsDiv.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <span style="font-size: 15px; font-weight: 600; display: block; color: var(--text-main);">${item.name}</span>
                                <button class="btn btn-remove" onclick="window.removeFromCart(${index})">Remove</button>
                            </div>
                            <div style="text-align: right;">
                                <span style="font-size: 16px; font-weight: 700; color: #fff;">${item.price.toFixed(2)} JOD</span>
                            </div>
                        </div>
                    `;
                });
                checkoutBtn.disabled = false;
            }
            cartTotalPrice.textContent = `${getCartTotal()} JOD`;
        }

        function showMessage(text, type) {
            messageDiv.style.display = 'block';
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        let up; 
        let transientToken;

        checkoutBtn.addEventListener('click', async () => {
            isCheckingOut = true; 
            checkoutBtn.disabled = true;
            const finalAmount = getCartTotal(); 
            const selectedEnv = envSelector.value; 
            
            showMessage(`Connecting to Proxy Server (${selectedEnv.toUpperCase()})...`, 'info');
            document.querySelectorAll('.add-to-cart-btn, .btn-remove').forEach(b => b.disabled = true);
            saveCardCheckbox.disabled = true;
            envSelector.disabled = true;

            try {
                const response = await fetch('/capture-context', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        amount: finalAmount,
                        origin: window.location.origin,
                        env: selectedEnv
                    })
                });
                
                const rawText = await response.text();
                if (!response.ok) throw new Error(rawText);
                
                let tokenRaw;
                try {
                    const parsedData = JSON.parse(rawText);
                    tokenRaw = typeof parsedData === 'string' ? parsedData : parsedData.token;
                } catch (e) {
                    tokenRaw = rawText.replace(/^"|"$/g, "").trim();
                }

                if (!tokenRaw) throw new Error("Could not parse bank secure token.");

                showMessage('Token received. Downloading Safe SDK...', 'info');
                
                const payloadBase64 = tokenRaw.split('.')[1];
                const decodedPayload = JSON.parse(atob(payloadBase64));
                const sdkUrl = decodedPayload.ctx[0].data.clientLibrary;
                const sdkIntegrity = decodedPayload.ctx[0].data.clientLibraryIntegrity || null;

                await new Promise((resolve, reject) => {
                    const existing = document.querySelector(`script[data-cybersource-sdk="true"]`);
                    if (existing) existing.remove();
                    delete window.Accept;
                    delete window.VAS;
                    delete window.CyberSource;

                    const script = document.createElement("script");
                    script.src = sdkUrl;
                    script.async = true;
                    script.setAttribute("data-cybersource-sdk", "true");
                    if (sdkIntegrity) {
                        script.integrity = sdkIntegrity;
                        script.crossOrigin = "anonymous";
                    }
                    script.onload = () => setTimeout(resolve, 200);
                    script.onerror = () => reject(new Error("Failed to load secure bank SDK"));
                    document.body.appendChild(script);
                });

                showMessage('Rendering payment sheet fields...', 'info');
                
                checkoutBtn.style.display = 'none';
                paymentContainer.style.display = 'block';

                const accept = await Accept(tokenRaw);
                up = await accept.unifiedPayments();

                transientToken = await up.show({
                    containers: {
                        paymentSelection: "#payment-form" 
                    }
                });

                messageDiv.style.display = 'none';
                payBtn.onclick = processPayment;

            } catch (error) {
                showMessage(`Setup failed: ${error.message}`, 'error');
                checkoutBtn.disabled = false;
                isCheckingOut = false;
                document.querySelectorAll('.add-to-cart-btn, .btn-remove').forEach(b => b.disabled = false);
                saveCardCheckbox.disabled = false;
                envSelector.disabled = false;
            }
        });

        async function processPayment() {
            payBtn.disabled = true;
            showMessage('Completing secure validation & 3DS...', 'info');
            const selectedEnv = envSelector.value;

            try {
                const completeResult = await up.complete(transientToken);
                let paymentStatus = completeResult.status;

                if (typeof completeResult === 'string' && completeResult.includes('.')) {
                    try {
                        const decodedPayload = JSON.parse(atob(completeResult.split('.')[1]));
                        paymentStatus = decodedPayload.status || decodedPayload.outcome; 
                    } catch (e) {
                        console.warn("Could not decode signature context.");
                    }
                }

                if (paymentStatus === "COMPLETED" || paymentStatus === "AUTHORIZED") {
                    showMessage('Payment Successful via Auto-Authorization!', 'success');
                    paymentContainer.style.display = 'none';
                    return;
                }
                
                showMessage(`Finalizing transaction settlement...`, 'info');
                
                const finalChargeResponse = await fetch('/process-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        transientToken: completeResult,
                        env: selectedEnv
                    })
                });

                const chargeResultRaw = await finalChargeResponse.text();
                if (!finalChargeResponse.ok) {
                    throw new Error(`Charge Failed: ${chargeResultRaw}`);
                }

                showMessage('Transaction successful! Gateway has processed funds.', 'success');
                paymentContainer.style.display = 'none';
                
            } catch (error) {
                showMessage(error.message || 'Payment execution failed.', 'error');
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
