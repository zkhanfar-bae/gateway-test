<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Checkout</title>
    <link rel="icon" href="data:,">
    
    <style>
        :root {
            --bg: #090d16;
            --sidebar-bg: #111827;
            --surface: #1e293b;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --cyan: #06b6d4;
            --violet: #8b5cf6;
            --gradient-primary: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
            --success: #10b981;
            --error: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            background: var(--bg); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            width: 100%;
            min-height: 100vh;
        }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { border-right: none !important; border-bottom: 1px solid var(--border); position: relative !important; height: auto !important; }
        }

        .sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--gradient-primary);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .brand-zone h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

        .control-group { margin-bottom: 24px; }
        .control-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        .sidebar select {
            width: 100%;
            padding: 14px;
            background: #1f2937;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='gray' stroke-width='2'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }
        .sidebar select:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(6, 182, 212, 0.15); }

        .config-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .config-card input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--violet); cursor: pointer; margin-top: 2px;}
        .config-card label { font-size: 13px; color: var(--text-secondary); font-weight: 500; cursor: pointer; line-height: 1.4; }

        .workspace {
            padding: 40px 60px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        @media (max-width: 640px) { .workspace { padding: 24px 16px; } }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }
        .workspace-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

        .status-pill {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }
        @media (max-width: 1200px) { .module-grid { grid-template-columns: 1fr; } }

        .panel-heading { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}

        .catalog-stack { display: flex; flex-direction: column; gap: 16px; }
        
        .item-tile {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .item-tile::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent;
        }
        .item-tile:hover {
            transform: translateX(4px);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .item-tile:hover::before { background: var(--cyan); }

        .item-meta h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .item-meta p { color: var(--text-secondary); font-size: 13px; }

        .item-action { text-align: right; }
        .tile-price { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 12px; letter-spacing: -0.5px; }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .item-tile .action-btn:hover { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }

        .billing-panel {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .receipt-row.total {
            border-top: 1px dashed rgba(255,255,255,0.15);
            border-bottom: none;
            font-size: 22px;
            font-weight: 800;
            padding-top: 20px;
            margin-top: 10px;
            color: #fff;
        }

        .btn-trash {
            color: var(--error);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }
        .btn-trash:hover { text-decoration: underline; }

        .master-trigger {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.25);
        }
        .master-trigger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
        }
        .master-trigger:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        #payment-container {
            display: none;
            margin-top: 24px;
            background: rgba(9, 13, 22, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        #payment-form { min-height: 60px; margin-bottom: 20px; }

        .terminal-log {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-family: "SFMono-Regular", Consolas, Menlo, monospace;
            font-weight: 500;
            display: none;
            border-left: 4px solid transparent;
        }
        .terminal-log.info { background: rgba(6,182,212,0.06); color: var(--cyan); border-left-color: var(--cyan); }
        .terminal-log.success { background: rgba(16,185,129,0.06); color: var(--success); border-left-color: var(--success); }
        .terminal-log.error { background: rgba(239,68,68,0.06); color: var(--error); border-left-color: var(--error); }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar">
            <div>
                <div class="brand-zone">
                    <div class="brand-icon"></div>
                    <h2>TechStore</h2>
                </div>
                
                <div class="control-group">
                    <label for="env-selector">Select Environment</label>
                    <select id="env-selector">
                        <option value="prod">BAE / CyberSource (LIVE PROD)</option>
                        <option value="dev">BAE / CyberSource (BAELAB DEV)</option>
                    </select>
                </div>
            </div>

            <div class="config-card">
                <input type="checkbox" id="save-card-cb">
                <label for="save-card-cb">Save card details for future monthly payments.</label>
            </div>
        </div>

        <div class="workspace">
            <div class="workspace-header">
                <div>
                    <h1>Checkout System</h1>
                </div>
                <div class="status-pill">PROXY READY</div>
            </div>

            <div class="module-grid">
                <div>
                    <h2 class="panel-heading">Available Products</h2>
                    <div class="catalog-stack" id="product-list">
                        <div class="item-tile">
                            <div class="item-meta">
                                <h3>Basic API Key</h3>
                                <p>Standard development pipeline sandbox</p>
                            </div>
                            <div class="item-action">
                                <div class="tile-price">0.10 USD</div>
                                <button type="button" class="action-btn add-to-cart-btn" data-id="1" data-name="Basic API Key" data-price="0.10">Add to Cart</button>
                            </div>
                        </div>

                        <div class="item-tile">
                            <div class="item-meta">
                                <h3>Pro Dashboard</h3>
                                <p>Enterprise dashboard access module</p>
                            </div>
                            <div class="item-action">
                                <div class="tile-price">0.15 USD</div>
                                <button type="button" class="action-btn add-to-cart-btn" data-id="2" data-name="Pro Dashboard" data-price="0.15">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="panel-heading">Cart Summary</h2>
                    <div class="billing-panel">
                        <div id="cart-items">
                            <p style="color: var(--text-secondary); font-size: 14px; text-align: center; padding: 24px 0;">Your cart is empty.</p>
                        </div>

                        <div class="receipt-row total">
                            <span>Total Price</span>
                            <span id="cart-total-price">0.00 USD</span>
                        </div>

                        <button type="button" id="checkout-btn" class="master-trigger" disabled>Proceed to Checkout</button>
                        <div id="message" class="terminal-log"></div>

                        <div id="payment-container">
                            <h2 class="panel-heading" style="font-size:11px; margin-bottom:16px;">Enter Card Details</h2>
                            <div id="payment-form"></div>
                            <button type="button" id="pay-btn" class="master-trigger" style="margin-top:0;">Complete Payment</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let isCheckingOut = false;

        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotalPrice = document.getElementById('cart-total-price');
        const checkoutBtn = document.getElementById('checkout-btn');
        const paymentContainer = document.getElementById('payment-container');
        const messageDiv = document.getElementById('message');
        const payBtn = document.getElementById('pay-btn');
        const envSelector = document.getElementById('env-selector');
        const saveCardCheckbox = document.getElementById('save-card-cb');

        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isCheckingOut) return;
                const id = btn.getAttribute('data-id');
                const name = btn.getAttribute('data-name');
                const price = parseFloat(btn.getAttribute('data-price'));
                cart.push({ id, name, price });
                renderCart();
            });
        });

        window.removeFromCart = function(index) {
            if (isCheckingOut) return;
            cart.splice(index, 1);
            renderCart();
        };

        function getCartTotal() {
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            return total.toFixed(2);
        }

        function renderCart() {
            cartItemsDiv.innerHTML = '';
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color: var(--text-secondary); font-size: 14px; text-align: center; padding: 24px 0;">Your cart is empty.</p>';
                checkoutBtn.disabled = true;
            } else {
                cart.forEach((item, index) => {
                    cartItemsDiv.innerHTML += `
                        <div class="receipt-row">
                            <div>
                                <span style="font-weight:600; display:block;">${item.name}</span>
                                <button type="button" class="btn-trash" onclick="window.removeFromCart(${index})">Remove Item</button>
                            </div>
                            <span style="font-weight:700; color:#fff;">${item.price.toFixed(2)} USD</span>
                        </div>
                    `;
                });
                checkoutBtn.disabled = false;
            }
            cartTotalPrice.textContent = `${getCartTotal()} USD`;
        }

        function showMessage(text, type) {
            messageDiv.style.display = 'block';
            messageDiv.textContent = `[Log] >> ${text}`;
            messageDiv.className = `terminal-log ${type}`;
        }

        let up; 
        let transientToken;

        checkoutBtn.addEventListener('click', async () => {
            isCheckingOut = true; 
            checkoutBtn.disabled = true;
            const finalAmount = getCartTotal(); 
            const selectedEnv = envSelector.value; 
            
            showMessage(`Connecting to proxy server (${selectedEnv.toUpperCase()})...`, 'info');
            document.querySelectorAll('.add-to-cart-btn, .btn-trash').forEach(b => b.disabled = true);
            saveCardCheckbox.disabled = true;
            envSelector.disabled = true;

            try {
                const response = await fetch('/capture-context', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        amount: finalAmount,
                        origin: window.location.origin,
                        env: selectedEnv
                    })
                });
                
                const rawText = await response.text();
                if (!response.ok) throw new Error(rawText);
                
                let tokenRaw;
                try {
                    const parsedData = JSON.parse(rawText);
                    tokenRaw = typeof parsedData === 'string' ? parsedData : parsedData.token;
                } catch (e) {
                    tokenRaw = rawText.replace(/^"|"$/g, "").trim();
                }

                if (!tokenRaw) throw new Error("Security verification token failed.");

                showMessage('Token received. Downloading bank security library...', 'info');
                
                const payloadBase64 = tokenRaw.split('.')[1];
                const decodedPayload = JSON.parse(atob(payloadBase64));
                const sdkUrl = decodedPayload.ctx[0].data.clientLibrary;
                const sdkIntegrity = decodedPayload.ctx[0].data.clientLibraryIntegrity || null;

                await new Promise((resolve, reject) => {
                    const existing = document.querySelector(`script[data-cybersource-sdk="true"]`);
                    if (existing) existing.remove();
                    delete window.Accept;
                    delete window.VAS;
                    delete window.CyberSource;

                    const script = document.createElement("script");
                    script.src = sdkUrl;
                    script.async = true;
                    script.setAttribute("data-cybersource-sdk", "true");
                    if (sdkIntegrity) {
                        script.integrity = sdkIntegrity;
                        script.crossOrigin = "anonymous";
                    }
                    script.onload = () => setTimeout(resolve, 200);
                    script.onerror = () => reject(new Error("Failed to load secure platform libraries."));
                    document.body.appendChild(script);
                });

                showMessage('Building payment fields...', 'info');
                
                checkoutBtn.style.display = 'none';
                paymentContainer.style.display = 'block';

                const accept = await Accept(tokenRaw);
                up = await accept.unifiedPayments();

                transientToken = await up.show({
                    containers: {
                        paymentSelection: "#payment-form" 
                    }
                });

                messageDiv.style.display = 'none';
                payBtn.onclick = processPayment;

            } catch (error) {
                showMessage(`Setup failed: ${error.message}`, 'error');
                checkoutBtn.disabled = false;
                isCheckingOut = false;
                document.querySelectorAll('.add-to-cart-btn, .btn-trash').forEach(b => b.disabled = false);
                saveCardCheckbox.disabled = false;
                envSelector.disabled = false;
            }
        });

        async function processPayment() {
            payBtn.disabled = true;
            showMessage('Running secure 3D-Secure bank checks...', 'info');
            const selectedEnv = envSelector.value;

            try {
                const completeResult = await up.complete(transientToken);
                let paymentStatus = completeResult.status;

                if (typeof completeResult === 'string' && completeResult.includes('.')) {
                    try {
                        const decodedPayload = JSON.parse(atob(completeResult.split('.')[1]));
                        paymentStatus = decodedPayload.status || decodedPayload.outcome; 
                    } catch (e) {
                        console.warn("Could not parse data trace metadata.");
                    }
                }

                if (paymentStatus === "COMPLETED" || paymentStatus === "AUTHORIZED") {
                    showMessage('Payment Authorized successfully inside secure loop!', 'success');
                    paymentContainer.style.display = 'none';
                    return;
                }
                
                showMessage(`Sending payment token to settlement pool...`, 'info');
                
                const finalChargeResponse = await fetch('/process-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        transientToken: completeResult,
                        env: selectedEnv
                    })
                });

                const chargeResultRaw = await finalChargeResponse.text();
                if (!finalChargeResponse.ok) {
                    throw new Error(`Charge Failed: ${chargeResultRaw}`);
                }

                showMessage('Transaction fully successful! Funds processed.', 'success');
                paymentContainer.style.display = 'none';
                
            } catch (error) {
                showMessage(error.message || 'Payment execution failed at the routing bank.', 'error');
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
